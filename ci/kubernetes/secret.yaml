apiVersion: v1
kind: Secret
metadata:
  name: pika-cluster
  labels:
    app.kubernetes.io/name: pika
type: Opaque
stringData:
  # Pre-shared key for cluster membership. All replicas MUST use the same
  # value; only peers carrying this PSK can join the cluster (see
  # internal/cluster/cluster.go: Config.SecurityKey). Mounted into the pod
  # as PIKA_CLUSTER_SECURITY_KEY.
  #
  # CHANGE ME before deploying. A long random string is recommended:
  #   openssl rand -base64 48
  security_key: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"
