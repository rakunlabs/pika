# SecretStore: Pika webhook provider (public port, no authentication)
#
# Uses Pika's public port (9090) which serves data without token authentication.
# Suitable when Pika and the consuming workloads are in the same trusted network.
#
# The ESO webhook provider calls:
#   GET http://pika.pika.svc.cluster.local:9090/data/<remoteRef.key>
#
# remoteRef.key can include query parameters for variant/version:
#   "myapp/config"                        -> latest version
#   "myapp/config?variant=prod"           -> production variant
#   "myapp/config?version=3"              -> exact version 3
#   "myapp/config?variant=prod&version=2" -> production variant, version 2
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pika
spec:
  provider:
    webhook:
      url: "http://pika.pika.svc.cluster.local:9090/data/{{ .remoteRef.key }}"
      result:
        jsonPath: "$"
      headers:
        Accept: application/octet-stream

# SecretStore: Pika webhook provider (authenticated port)
#
# Uses Pika's main port (8080) which requires a Bearer token.
# The token must be created in Pika's UI (Settings > Tokens) and stored
# in a Kubernetes Secret with the label:
#   external-secrets.io/type: webhook
#
# The token's scopes control which Pika paths this SecretStore can access.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pika-auth
spec:
  provider:
    webhook:
      url: "http://pika.pika.svc.cluster.local:8080/data/{{ .remoteRef.key }}"
      result:
        jsonPath: "$"
      headers:
        Accept: application/octet-stream
        Authorization: "Bearer {{ .auth.token }}"
      secrets:
        - name: auth
          secretRef:
            name: pika-token

# Kubernetes Secret holding the Pika API token.
# Create a token in Pika's UI (Settings > Tokens), then base64-encode it here.
#
# The label "external-secrets.io/type: webhook" is required for ESO to
# allow the webhook provider to reference this secret.
---
apiVersion: v1
kind: Secret
metadata:
  name: pika-token
  labels:
    external-secrets.io/type: webhook
data:
  token: ""  # base64-encoded Pika token (e.g., pika_xxxx...)
