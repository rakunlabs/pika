# Example 1: Pull individual config files from Pika into a Kubernetes Secret.
#
# Each "data" entry maps a key in the resulting K8s Secret to a file in Pika.
# The remoteRef.key is the Pika file path, optionally with query parameters
# for variant and version selection.
#
# The resulting Secret can be mounted as a volume so files appear in a folder:
#
#   volumes:
#     - name: app-config
#       secret:
#         secretName: app-config
#   containers:
#     - volumeMounts:
#         - name: app-config
#           mountPath: /etc/app
#           readOnly: true
#
# This produces:
#   /etc/app/config.yaml   (from Pika: myapp/config, prod variant)
#   /etc/app/secrets.json  (from Pika: myapp/secrets)
#   /etc/app/ca.crt        (from Pika: myapp/tls/ca)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-config
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: pika
    kind: SecretStore
  target:
    name: app-config
  data:
    - secretKey: config.yaml
      remoteRef:
        key: "myapp/config?variant=prod"

    - secretKey: secrets.json
      remoteRef:
        key: "myapp/secrets"

    - secretKey: ca.crt
      remoteRef:
        key: "myapp/tls/ca"

# Example 2: Pull a pinned version of a config file.
#
# Use version in the query parameter to pin to a specific version.
# This is useful for production workloads where you want explicit control
# over which config version is deployed.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-config-pinned
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: pika
    kind: SecretStore
  target:
    name: app-config-pinned
  data:
    - secretKey: config.yaml
      remoteRef:
        key: "myapp/config?variant=prod&version=5"

# Example 3: Using the authenticated SecretStore.
#
# References the "pika-auth" SecretStore which uses a Bearer token.
# Useful when Pika's public port is not exposed or when you need
# scope-based access control on which files can be fetched.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-config-auth
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: pika-auth
    kind: SecretStore
  target:
    name: app-config-auth
  data:
    - secretKey: config.yaml
      remoteRef:
        key: "myapp/config?variant=prod"

# Example 4: TLS certificates from Pika as a kubernetes.io/tls Secret.
#
# Pika can store certificate files using the "raw" format.
# ESO pulls them into a properly-typed TLS Secret that can be used
# by Ingress controllers, service meshes, etc.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-tls
spec:
  refreshInterval: "10m"
  secretStoreRef:
    name: pika
    kind: SecretStore
  target:
    name: app-tls
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: "myapp/tls/cert"

    - secretKey: tls.key
      remoteRef:
        key: "myapp/tls/key"
