apiVersion: v1
kind: ConfigMap
metadata:
  name: pika
data:
  pika.yaml: |
    log_level: info
    server:
      port: "8080"
      public_port: "9090"
      compat:
        consul_kv:
          base_path: /consul
      auth:
        session_ttl: 24h
        cookie:
          secure: true
          same_site: lax
    storage:
      sqlite:
        dsn: file:/data/pika.db?cache=shared
